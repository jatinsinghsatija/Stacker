<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 108 108" role="img" aria-label="Stacker icon: three stacked plates under a magnifier">
  <title>Stacker</title>
  <desc>Three offset blue plates stacked in perspective with a white magnifier resting on the top plate, on a dark rounded background.</desc>

  <!-- Geometry is copied verbatim from the Android launcher icon
       (android/src/main/res/drawable/ic_stacker_launcher.xml) so the README
       and the icon a developer sees on their home screen are the same mark. -->
