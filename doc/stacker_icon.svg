  <path fill="#1A3A8F" d="M54,86 L20,72 L54,58 L88,72 Z"/>
  <path fill="#2962FF" d="M54,69 L25,57 L54,45 L83,57 Z"/>
  <path fill="#5B8DEF" d="M54,52 L30,42 L54,32 L78,42 Z"/>

  <circle fill="#FFFFFF" cx="58" cy="26" r="9.5"/>
  <circle fill="#2962FF" cx="58" cy="26" r="6"/>
