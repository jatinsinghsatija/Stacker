name: stacker_host
description: "Flutter module that packages the Stacker dashboard for embedding in native Android and iOS apps."
publish_to: "none"

# Keep this in step with the root `stacker` package version and with the
# JitPack release tag, so a developer reading `com.github.<you>:stacker:v0.1.0`
# knows exactly which dashboard build they have.
version: 0.2.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # The library itself. A path dependency keeps the module and the library in
  # one repository and one tag, so the AAR can never be built against a
  # different version of the Dart code than the tag claims.
  stacker_inspector:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  module:
    androidX: true
    androidPackage: com.stacker.stacker_host
    iosBundleIdentifier: com.stacker.stackerHost
